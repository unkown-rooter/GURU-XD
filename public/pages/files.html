<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GURU-XD - Files Explorer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/files.css">
</head>
<body>
  <div class="loader-wrapper" id="app-loader">
    <div class="spinner"></div>
    <div class="loader-text">Loading File Directory...</div>
  </div>

  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="navbar-container"></div>

      <main class="page-body">
        <div class="page-header flex-between">
          <div>
            <h1 class="page-heading">Files Explorer</h1>
            <p class="page-subheading font-sans">Manage downloaded media files, voice notes, and server export backups.</p>
          </div>
          <div>
            <button class="btn btn-primary btn-sm" onclick="triggerFileUpload()">
              <i class="fa-solid fa-cloud-arrow-up"></i> Upload Media
            </button>
          </div>
        </div>

        <div class="files-layout-grid">
          <!-- Left Main Pane: Files Category and Explorer Grid -->
          <div class="files-main-pane">
            <div class="card files-filter-card">
              <div class="filter-flex-row">
                <input class="form-control" type="text" id="file-search" placeholder="Search files by name, type, extension..." oninput="renderFilesGrid()">
                <div class="file-category-chips">
                  <button class="category-chip active" onclick="filterFileType('all')" id="fchip-all">All Files</button>
                  <button class="category-chip" onclick="filterFileType('image')" id="fchip-image">Images</button>
                  <button class="category-chip" onclick="filterFileType('video')" id="fchip-video">Videos</button>
                  <button class="category-chip" onclick="filterFileType('document')" id="fchip-document">Documents</button>
                  <button class="category-chip" onclick="filterFileType('audio')" id="fchip-audio">Audios</button>
                </div>
              </div>
            </div>

            <!-- File Cards Grid -->
            <div class="files-cards-grid" id="files-grid-container">
              <!-- Dynamically Populated -->
            </div>
          </div>

          <!-- Right Sidebar: Storage Summary and Upload Dropzone -->
          <div class="files-sidebar-pane">
            <!-- Storage Card -->
            <div class="card storage-details-card">
              <div class="card-title">Storage Summary</div>
              <div class="radial-storage-container">
                <div class="storage-percentage-ring">
                  <span class="percentage-number">12.4%</span>
                  <span class="percentage-label">Disk Occupied</span>
                </div>
              </div>
              
              <div class="storage-breakdown-list">
                <div class="breakdown-item">
                  <div class="item-head">
                    <span><i class="fa-solid fa-image text-primary"></i> Images</span>
                    <strong>4.2 GB</strong>
                  </div>
                  <div class="progress-bar-container"><div class="progress-bar-fill bg-primary" style="width: 33%"></div></div>
                </div>
                <div class="breakdown-item">
                  <div class="item-head">
                    <span><i class="fa-solid fa-video text-success"></i> Videos</span>
                    <strong>5.8 GB</strong>
                  </div>
                  <div class="progress-bar-container"><div class="progress-bar-fill bg-success" style="width: 48%"></div></div>
                </div>
                <div class="breakdown-item">
                  <div class="item-head">
                    <span><i class="fa-solid fa-file-pdf text-warning"></i> Documents</span>
                    <strong>1.1 GB</strong>
                  </div>
                  <div class="progress-bar-container"><div class="progress-bar-fill bg-warning" style="width: 10%"></div></div>
                </div>
                <div class="breakdown-item">
                  <div class="item-head">
                    <span><i class="fa-solid fa-volume-high text-danger"></i> Audios</span>
                    <strong>1.3 GB</strong>
                  </div>
                  <div class="progress-bar-container"><div class="progress-bar-fill bg-danger" style="width: 9%"></div></div>
                </div>
              </div>
            </div>

            <!-- Upload dropzone -->
            <div class="card upload-dropzone-card">
              <div class="card-title">Import File Asset</div>
              <div class="drag-drop-area" id="files-drag-area">
                <i class="fa-solid fa-folder-plus upload-icon"></i>
                <span class="upload-title">Drop files to save</span>
                <span class="upload-sub">or click to browse filesystem</span>
                <input type="file" id="files-file-input" style="display: none;" multiple>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/assets/js/sidebar.js"></script>
  <script src="/assets/js/navbar.js"></script>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/files.js"></script>
</body>
</html>
