<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GURU-XD - User Database</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/users.css">
</head>
<body>
  <div class="loader-wrapper" id="app-loader">
    <div class="spinner"></div>
    <div class="loader-text">Loading Subscriber Database...</div>
  </div>

  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="navbar-container"></div>

      <main class="page-body">
        <div class="page-header flex-between">
          <div>
            <h1 class="page-heading">Subscriber Database</h1>
            <p class="page-subheading font-sans">Manage WhatsApp group participants, contacts, active message counts, and blocks.</p>
          </div>
          <div>
            <button class="btn btn-outline btn-sm" onclick="exportUsersCsv()">
              <i class="fa-solid fa-file-csv"></i> Export Contacts CSV
            </button>
          </div>
        </div>

        <!-- Filters card -->
        <div class="card users-filter-card">
          <div class="filter-flex-row" style="flex-direction: row;">
            <div class="search-input-group" style="flex: 2;">
              <i class="fa-solid fa-magnifying-glass search-icon"></i>
              <input type="text" placeholder="Search contacts by username, mobile number, or country prefix..." id="user-search" oninput="renderUsersTable()">
            </div>
            
            <div class="selectors-group">
              <select class="form-control filter-select" id="user-status-filter" onchange="renderUsersTable()">
                <option value="all">All Roles</option>
                <option value="admin">Administrator</option>
                <option value="member">Regular Member</option>
                <option value="blocked">Blocked Client</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Users table -->
        <div class="card table-card">
          <div class="table-responsive">
            <table class="table" id="users-table">
              <thead>
                <tr>
                  <th>Subscriber Info</th>
                  <th>Phone Number</th>
                  <th>Status Role</th>
                  <th>Shared Groups</th>
                  <th>Message Quota</th>
                  <th>Last Seen Telemetry</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="users-table-body">
                <!-- Populated dynamically by JS -->
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="pagination">
            <button class="page-btn" id="prev-page-btn" onclick="changePage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="pagination-info" id="pagination-info-text">Page 1 of 1</span>
            <button class="page-btn" id="next-page-btn" onclick="changePage(1)"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/assets/js/sidebar.js"></script>
  <script src="/assets/js/navbar.js"></script>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/users.js"></script>
</body>
</html>
